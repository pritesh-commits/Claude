<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A murmuration of 500 winged tigers</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:14px;bottom:10px;font:12px/1.4 system-ui,sans-serif;color:#9fb0cc;opacity:.7;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">500 winged tigers · a dragon sometimes visits · move the pointer to be the dragon · click to roar and breathe fire</div>
<script>
(() => {
  const N = 500;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W, H, DPR;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * DPR;
    H = cv.height = innerHeight * DPR;
    sky = null;
  }
  let sky = null;
  addEventListener('resize', resize);
  resize();

  // Tuning (units: CSS pixels; scaled by S)
  const S = () => Math.min(W, H) / 900 * DPR;
  const K = 7;                 // topological neighbours (real starlings track ~6-7)
  const VIS = 70;              // neighbour search radius
  const MAXSPD = 5.2, MINSPD = 2.4;
  const MAXF = 0.2;

  const birds = [];
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 120;
    birds.push({
      x: W / 2 + Math.cos(a) * r * S(), y: H / 2 + Math.sin(a) * r * S(),
      vx: Math.cos(a + 1.5) * 3, vy: Math.sin(a + 1.5) * 3,
      ph: Math.random() * 6.28, fr: 0.28 + Math.random() * 0.08,
      sz: 0.8 + Math.random() * 0.4, ang: 0, ca: 1, sa: 0
    });
  }

  // Roost: a wandering target the flock is loosely drawn toward
  let t = 0;
  const roost = { x: W / 2, y: H / 2 };
  // Falcon
  const SEG = 24;
  const falcon = { x: 0, y: 0, vx: 0, vy: 0, ang: 0, on: false, until: 0, user: false, fire: 0, roar: 0, seg: [] };
  const flames = [];
  let ptr = null, down = false;
  cv.addEventListener('pointermove', e => { ptr = { x: e.clientX * DPR, y: e.clientY * DPR }; });
  cv.addEventListener('pointerleave', () => { ptr = null; down = false; });
  cv.addEventListener('pointerup', () => { down = false; });
  cv.addEventListener('pointerdown', e => {
    down = true; falcon.roar = 1;
    roar(falcon.on ? falcon.x : e.clientX * DPR, falcon.on ? falcon.y : e.clientY * DPR, 3);
  });
  function roar(px, py, power) {
    for (const b of birds) {
      const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy) || 1;
      if (d < 420 * S()) { const k = 1 - d / (420 * S()); b.vx += dx / d * power * (0.4 + k); b.vy += dy / d * power * (0.4 + k); }
    }
  }
  function resetSeg() { falcon.seg = []; for (let i = 0; i < SEG; i++) falcon.seg.push({ x: falcon.x, y: falcon.y }); }

  // Spatial grid for neighbour lookup
  const CELL = VIS;
  function buildGrid() {
    const cs = CELL * S();
    const cols = Math.ceil(W / cs) + 2, rows = Math.ceil(H / cs) + 2;
    const cells = new Array(cols * rows);
    for (const b of birds) {
      const cx = Math.max(0, Math.min(cols - 1, (b.x / cs | 0) + 1));
      const cy = Math.max(0, Math.min(rows - 1, (b.y / cs | 0) + 1));
      const k = cy * cols + cx;
      (cells[k] || (cells[k] = [])).push(b);
      b.cx = cx; b.cy = cy;
    }
    return { cells, cols, rows, cs };
  }

  const cand = [];
  function step() {
    t += 1;
    const s = S();
    // Roost wanders on a slow Lissajous path
    roost.x = W / 2 + Math.sin(t * 0.0021) * W * 0.28 + Math.sin(t * 0.0057) * W * 0.06;
    roost.y = H / 2 + Math.cos(t * 0.0016) * H * 0.2 + Math.sin(t * 0.0043) * H * 0.05;

    // Dragon: follows the pointer if present, otherwise visits now and then
    if (ptr) {
      if (!falcon.on || !falcon.user) { falcon.x = ptr.x; falcon.y = ptr.y; resetSeg(); }
      falcon.on = true; falcon.user = true;
      falcon.vx = (ptr.x - falcon.x) * 0.09; falcon.vy = (ptr.y - falcon.y) * 0.09;
      falcon.fire = down ? 1 : 0;
    } else {
      if (falcon.user) { falcon.on = false; falcon.user = false; }
      if (!falcon.on && Math.random() < 0.0035) {
        const side = Math.random() * 4 | 0;
        falcon.x = side === 0 ? -80 : side === 1 ? W + 80 : Math.random() * W;
        falcon.y = side === 2 ? -80 : side === 3 ? H + 80 : Math.random() * H;
        falcon.vx = falcon.vy = 0; falcon.on = true; falcon.until = t + 900; falcon.born = t;
        resetSeg();
        falcon.ang = Math.atan2(H / 2 - falcon.y, W / 2 - falcon.x);
      }
      if (falcon.on) {
        let cx = 0, cy = 0;
        for (const b of birds) { cx += b.x; cy += b.y; }
        cx /= N; cy /= N;
        const dx = cx - falcon.x, dy = cy - falcon.y, d = Math.hypot(dx, dy) || 1;
        const wob = Math.sin(t * 0.04) * 0.12;
        falcon.vx += (dx / d - dy / d * wob) * 0.1; falcon.vy += (dy / d + dx / d * wob) * 0.1;
        const sp = Math.hypot(falcon.vx, falcon.vy), mx = 4.6 * s;
        if (sp > mx) { falcon.vx *= mx / sp; falcon.vy *= mx / sp; }
        const ph = (t - falcon.born) % 260;
        falcon.fire = ph > 90 && ph < 170 ? 1 : 0;
        if (ph === 90 || ph === 200) falcon.roar = 1;
        if (t > falcon.until) falcon.on = false;
      }
    }
    if (falcon.on) {
      falcon.x += falcon.vx; falcon.y += falcon.vy;
      if (Math.hypot(falcon.vx, falcon.vy) > 0.6) {
        let da = Math.atan2(falcon.vy, falcon.vx) - falcon.ang;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        falcon.ang += da * 0.12;
      }
      // body chain
      let px = falcon.x, py = falcon.y; const gap = 15 * s;
      for (const q of falcon.seg) {
        const dx = px - q.x, dy = py - q.y, d = Math.hypot(dx, dy) || 1;
        if (d > gap) { q.x = px - dx / d * gap; q.y = py - dy / d * gap; }
        px = q.x; py = q.y;
      }
      // fire particles
      if (falcon.fire) {
        for (let i = 0; i < 5; i++) {
          const a = falcon.ang + (Math.random() - 0.5) * 0.45, v = (5 + Math.random() * 5) * s;
          flames.push({ x: falcon.x + Math.cos(falcon.ang) * 28 * s, y: falcon.y + Math.sin(falcon.ang) * 28 * s,
                        vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, r: (5 + Math.random() * 6) * s });
        }
      }
      if (falcon.roar === 1) { roar(falcon.x, falcon.y, 2.5); falcon.roar = 0.999; }
    }
    for (let i = flames.length - 1; i >= 0; i--) {
      const f = flames[i]; f.x += f.vx; f.y += f.vy; f.vx *= 0.97; f.vy *= 0.97; f.life -= 0.028; f.r *= 1.01;
      if (f.life <= 0) flames.splice(i, 1);
    }
    if (falcon.roar < 1 && falcon.roar > 0) falcon.roar -= 0.02; else if (falcon.roar <= 0) falcon.roar = 0;

    const g = buildGrid();
    const vis = VIS * s, vis2 = vis * vis;
    const sepR = 14 * s, sepR2 = sepR * sepR;

    for (const b of birds) {
      cand.length = 0;
      for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
        const x = b.cx + ox, y = b.cy + oy;
        if (x < 0 || y < 0 || x >= g.cols || y >= g.rows) continue;
        const c = g.cells[y * g.cols + x];
        if (!c) continue;
        for (const o of c) {
          if (o === b) continue;
          const dx = o.x - b.x, dy = o.y - b.y, d2 = dx * dx + dy * dy;
          if (d2 < vis2) { o.d2 = d2; cand.push(o); }
        }
      }
      // Topological: keep the K nearest only
      if (cand.length > K) { cand.sort((p, q) => p.d2 - q.d2); cand.length = K; }

      let ax = 0, ay = 0, cxs = 0, cys = 0, sx = 0, sy = 0;
      const n = cand.length;
      for (const o of cand) {
        ax += o.vx; ay += o.vy; cxs += o.x; cys += o.y;
        if (o.d2 < sepR2) {
          const d = Math.sqrt(o.d2) || 1;
          sx -= (o.x - b.x) / d * (1 - d / sepR);
          sy -= (o.y - b.y) / d * (1 - d / sepR);
        }
      }
      let fx = 0, fy = 0;
      if (n) {
        // alignment
        fx += (ax / n - b.vx) * 0.09; fy += (ay / n - b.vy) * 0.09;
        // cohesion
        fx += (cxs / n - b.x) * 0.0016 / s; fy += (cys / n - b.y) * 0.0016 / s;
        // separation
        fx += sx * 0.5; fy += sy * 0.5;
      }
      // roost attraction (weak, grows with distance)
      const rx = roost.x - b.x, ry = roost.y - b.y, rd = Math.hypot(rx, ry) || 1;
      const pull = Math.min(rd / (W * 0.4), 1) * 0.045;
      fx += rx / rd * pull; fy += ry / rd * pull;

      // falcon avoidance — strong, wide, so the flock ripples away
      if (falcon.on) {
        const dx = b.x - falcon.x, dy = b.y - falcon.y, d = Math.hypot(dx, dy) || 1;
        const R = 300 * s;
        if (d < R) {
          const k = (1 - d / R);
          fx += dx / d * k * k * 1.3; fy += dy / d * k * k * 1.3;
          // panic: erratic jinking near the dragon
          fx += (Math.random() - 0.5) * k * 0.5; fy += (Math.random() - 0.5) * k * 0.5;
        }
        if (falcon.fire) {
          const ahead = dx * Math.cos(falcon.ang) + dy * Math.sin(falcon.ang);
          if (ahead > 0 && ahead < 330 * s && Math.abs(-dx * Math.sin(falcon.ang) + dy * Math.cos(falcon.ang)) < ahead * 0.35 + 30 * s) {
            fx += dx / d * 0.8; fy += dy / d * 0.8;
          }
        }
      }

      // soft walls: turn back in rather than bounce
      const m = 90 * s;
      if (b.x < m) fx += (m - b.x) / m * 0.12; else if (b.x > W - m) fx -= (b.x - (W - m)) / m * 0.12;
      if (b.y < m) fy += (m - b.y) / m * 0.12; else if (b.y > H - m) fy -= (b.y - (H - m)) / m * 0.12;

      // tiny noise keeps the murmuration from freezing into a rigid shape
      fx += (Math.random() - 0.5) * 0.03; fy += (Math.random() - 0.5) * 0.03;

      const fm = Math.hypot(fx, fy);
      if (fm > MAXF) { fx *= MAXF / fm; fy *= MAXF / fm; }
      b.vx += fx; b.vy += fy;
    }

    for (const b of birds) {
      let sp = Math.hypot(b.vx, b.vy) || 1;
      const lo = MINSPD, hi = MAXSPD;
      const c = Math.max(lo, Math.min(hi, sp));
      b.vx *= c / sp; b.vy *= c / sp;
      b.x += b.vx * s; b.y += b.vy * s;
      b.ph += b.fr; b.ang = Math.atan2(b.vy, b.vx); b.ca = Math.cos(b.ang); b.sa = Math.sin(b.ang);
    }
  }

  function drawSky() {
    if (!sky) {
      sky = document.createElement('canvas'); sky.width = W; sky.height = H;
      const c = sky.getContext('2d');
      const g = c.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#070b22'); g.addColorStop(0.5, '#1f2a6b');
      g.addColorStop(0.8, '#6d4a98'); g.addColorStop(1, '#c97fa0');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
      for (let i = 0; i < 160; i++) {
        c.fillStyle = 'rgba(255,255,255,' + (0.2 + Math.random() * 0.6) + ')';
        const r = (0.5 + Math.random() * 1.2) * DPR;
        c.fillRect(Math.random() * W, Math.random() * H * 0.6, r, r);
      }
      const mg = c.createRadialGradient(W * 0.15, H * 0.2, 0, W * 0.15, H * 0.2, 150 * DPR);
      mg.addColorStop(0, 'rgba(255,248,220,.35)'); mg.addColorStop(1, 'rgba(255,248,220,0)');
      c.fillStyle = mg; c.fillRect(0, 0, W, H);
      c.fillStyle = '#fff6dc'; c.beginPath(); c.arc(W * 0.15, H * 0.2, 28 * DPR, 0, 6.283); c.fill();
      // faint cloud streaks
      for (let i = 0; i < 14; i++) {
        const y = H * (0.25 + Math.random() * 0.55), x = Math.random() * W;
        const w = W * (0.15 + Math.random() * 0.3), h = 6 * DPR + Math.random() * 14 * DPR;
        const cg = c.createLinearGradient(x, 0, x + w, 0);
        cg.addColorStop(0, 'rgba(20,15,50,0)'); cg.addColorStop(.5, 'rgba(20,15,50,.18)'); cg.addColorStop(1, 'rgba(20,15,50,0)');
        c.fillStyle = cg; c.fillRect(x, y, w, h);
      }
    }
    ctx.drawImage(sky, 0, 0);
  }

  const TAU = Math.PI * 2;
  function drawTigers(s) {
    // wings (cream, translucent), with a flapping span
    ctx.fillStyle = 'rgba(250,240,215,0.92)';
    ctx.beginPath();
    for (const b of birds) {
      const u = 1.5 * s * b.sz, ca = b.ca, sa = b.sa, f = Math.sin(b.ph);
      const span = 8 + f * 5, back = 1.2 + (1 - f) * 1.4;
      for (const side of [1, -1]) {
        const P = (lx, ly) => [b.x + ca * lx * u - sa * ly * u * side, b.y + sa * lx * u + ca * ly * u * side];
        const a1 = P(2.5, 1), a2 = P(-back * 0.2, span), a3 = P(-back - 2.5, span * 0.7), a4 = P(-3.5, 1.5);
        ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]); ctx.lineTo(a3[0], a3[1]); ctx.lineTo(a4[0], a4[1]); ctx.closePath();
      }
    }
    ctx.fill();
    // tails
    ctx.strokeStyle = '#e8772e'; ctx.lineCap = 'round';
    for (const b of birds) {
      const u = 1.5 * s * b.sz, ca = b.ca, sa = b.sa, w = Math.sin(b.ph * 0.7) * 2;
      ctx.lineWidth = 1.1 * u;
      ctx.beginPath(); ctx.moveTo(b.x - ca * 4.5 * u, b.y - sa * 4.5 * u);
      ctx.quadraticCurveTo(b.x - ca * 7.5 * u - sa * w * u, b.y - sa * 7.5 * u + ca * w * u,
                           b.x - ca * 10 * u - sa * w * 2 * u, b.y - sa * 10 * u + ca * w * 2 * u);
      ctx.stroke();
    }
    // bodies + heads
    ctx.fillStyle = '#ee8030';
    ctx.beginPath();
    for (const b of birds) {
      const u = 1.5 * s * b.sz, ca = b.ca, sa = b.sa;
      ctx.moveTo(b.x + ca * 5 * u, b.y + sa * 5 * u);
      ctx.ellipse(b.x, b.y, 5 * u, 2.3 * u, b.ang, 0, TAU);
      const hx = b.x + ca * 5.8 * u, hy = b.y + sa * 5.8 * u;
      ctx.moveTo(hx + 2 * u, hy); ctx.arc(hx, hy, 2 * u, 0, TAU);
      for (const e of [1, -1]) {
        const ex = hx - sa * 1.5 * u * e - ca * 0.5 * u, ey = hy + ca * 1.5 * u * e - sa * 0.5 * u;
        ctx.moveTo(ex + 0.8 * u, ey); ctx.arc(ex, ey, 0.8 * u, 0, TAU);
      }
    }
    ctx.fill();
    // stripes
    ctx.strokeStyle = '#1a0f0a'; ctx.lineCap = 'butt';
    ctx.beginPath();
    for (const b of birds) {
      const u = 1.5 * s * b.sz, ca = b.ca, sa = b.sa;
      for (const x of [-2.4, -0.6, 1.4, 3.4]) {
        ctx.moveTo(b.x + ca * x * u - sa * 2.2 * u, b.y + sa * x * u + ca * 2.2 * u);
        ctx.lineTo(b.x + ca * x * u + sa * 2.2 * u, b.y + sa * x * u - ca * 2.2 * u);
      }
    }
    ctx.lineWidth = 0.7 * 1.5 * s; ctx.stroke();
  }

  function drawDragon(s) {
    if (!falcon.on) return;
    const pts = [{ x: falcon.x, y: falcon.y }, ...falcon.seg];
    // wings on segment 2
    const flap = Math.sin(t * 0.12), a = falcon.ang;
    const wp = pts[2], wa = a, ca = Math.cos(wa), sa = Math.sin(wa);
    ctx.fillStyle = 'rgba(120,20,40,0.92)';
    for (const side of [1, -1]) {
      const P = (lx, ly) => [wp.x + (ca * lx - sa * ly * side) * s, wp.y + (sa * lx + ca * ly * side) * s];
      const span = 85 + flap * 28;
      const p0 = P(10, 4), p1 = P(-5, span), p2 = P(-35, span * 0.75), p3 = P(-55, span * 0.45), p4 = P(-70, span * 0.25), p5 = P(-45, 5);
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]); ctx.lineTo(p4[0], p4[1]); ctx.lineTo(p5[0], p5[1]);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2a0a12'; ctx.lineWidth = 2 * s;
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
    }
    // tail-to-head body
    for (let i = pts.length - 1; i >= 0; i--) {
      const k = i / pts.length, r = (13 - k * 9) * s;
      ctx.fillStyle = i % 2 ? '#1f6a45' : '#2a8558';
      ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, Math.max(r, 2 * s), 0, TAU); ctx.fill();
      if (i % 3 === 0 && i > 0) { // dorsal spikes
        ctx.fillStyle = '#c03a2a';
        ctx.beginPath(); ctx.arc(pts[i].x - sa * r, pts[i].y + ca * r, 3 * s, 0, TAU); ctx.fill();
      }
    }
    // head
    const hx = falcon.x, hy = falcon.y;
    ctx.fillStyle = '#2a8558';
    ctx.beginPath();
    const H_ = (lx, ly) => [hx + (ca * lx - sa * ly) * s, hy + (sa * lx + ca * ly) * s];
    const h = [H_(-10, -12), H_(14, -9), H_(32, -4), H_(32, 4), H_(14, 9), H_(-10, 12)];
    ctx.moveTo(h[0][0], h[0][1]); for (const q of h) ctx.lineTo(q[0], q[1]); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8d8a0';
    for (const side of [1, -1]) {  // horns
      const b0 = H_(-6, 9 * side), b1 = H_(-26, 18 * side), b2 = H_(-12, 4 * side);
      ctx.beginPath(); ctx.moveTo(b0[0], b0[1]); ctx.lineTo(b1[0], b1[1]); ctx.lineTo(b2[0], b2[1]); ctx.fill();
    }
    ctx.fillStyle = falcon.fire ? '#ffe040' : '#ffcc20';
    for (const side of [1, -1]) {  // eyes
      const e = H_(10, 6 * side); ctx.beginPath(); ctx.arc(e[0], e[1], 2.6 * s, 0, TAU); ctx.fill();
    }
    // roar shockwave ring
    if (falcon.roar > 0) {
      ctx.strokeStyle = 'rgba(255,230,180,' + falcon.roar * 0.6 + ')'; ctx.lineWidth = 3 * s;
      ctx.beginPath(); ctx.arc(falcon.x, falcon.y, (1 - falcon.roar) * 420 * s, 0, TAU); ctx.stroke();
    }
  }

  function drawFlames() {
    ctx.globalCompositeOperation = 'lighter';
    for (const f of flames) {
      const l = f.life;
      ctx.fillStyle = l > 0.6 ? 'rgba(255,230,140,' + l * 0.5 + ')' : l > 0.3 ? 'rgba(255,120,30,' + l * 0.7 + ')' : 'rgba(200,40,20,' + l * 0.6 + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame() {
    step();
    drawSky();
    const s = S();
    drawDragon(s);
    drawFlames();
    drawTigers(s);
    // ground silhouette
    const gh = H * 0.07;
    ctx.fillStyle = '#0c0a16';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20 * DPR) {
      ctx.lineTo(x, H - gh * (0.5 + 0.5 * Math.sin(x * 0.004 / DPR + 1) * Math.cos(x * 0.0017 / DPR)));
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
